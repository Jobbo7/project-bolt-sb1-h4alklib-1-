name: Build Android Production Bundle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  compile-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK Compiler Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Hard Sandbox Native Mobile Workspace
        run: |
          # Create a separate clean workspace folder
          mkdir -p ../mobile-sandbox
          
          # Move ONLY the clean mobile configuration and wrapper files into the isolated area
          cp package.json ../mobile-sandbox/
          cp app.json ../mobile-sandbox/
          cp eas.json ../mobile-sandbox/
          cp index.js ../mobile-sandbox/
          cp babel.config.js ../mobile-sandbox/
          cp metro.config.js ../mobile-sandbox/
          
          # Switch the primary runner environment to the clean sandbox directory
          echo "SANDBOX_ROOT=$(cd ../mobile-sandbox && pwd)" >> $GITHUB_ENV

      - name: Install Pure Mobile Dependencies
        run: |
          cd ${{ env.SANDBOX_ROOT }}
          npm install --legacy-peer-deps

      - name: Build Isolated Production Assets
        run: |
          cd ${{ env.SANDBOX_ROOT }}
          npx expo prebuild --no-install --platform android
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload Final Build Artifact to Dashboard
        uses: actions/upload-artifact@v4
        with:
          name: partsforge-release.aab
          path: "**/android/app/build/outputs/bundle/release/app-release.aab"
          if-no-files-found: error
