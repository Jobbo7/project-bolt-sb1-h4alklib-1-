name: Build and Verify Workspace Matrix

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository Node
        uses: actions/checkout@v4

      - name: Initialize Node.js Environment Matrix
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Project Dependencies and Core Packages
        run: npm install --legacy-peer-deps

      - name: Compile and Verify Production Web Distribution Bundle
        run: npm run build --if-present
