name: Extract Permanent Android PEM Certificate

on:
  workflow_dispatch: # Allows you to trigger this manually with a single click

jobs:
  generate-pem-file:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java JDK 21 Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Ingest Keystore and Extract Clean PEM Document
        run: |
          # 1. Reconstruct your permanent keystore file from your saved repository secret
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > partsforge-permanent.keystore
          
          # 2. Execute Google's exact export command natively inside the cloud environment
          keytool -export -rfc -keystore partsforge-permanent.keystore -alias partsforge_key -file upload_certificate.pem -storepass "partsforge123"

      - name: Print Raw PEM Certificate Text to Screen
        run: |
          echo "========================================================================"
          echo "📋 COPY EVERYTHING BELOW THIS LINE (INCLUDING THE BEGIN/END TAGS):"
          echo "========================================================================"
          cat upload_certificate.pem
          echo "========================================================================"

      - name: Upload Raw PEM File as Downloadable Artifact Drop
        uses: actions/upload-artifact@v4
        with:
          name: upload_certificate_file
          path: upload_certificate.pem
