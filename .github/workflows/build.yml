name: Build and Verify Workspace Matrix

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# ⚡ GLOBAL ENVIRONMENT SWITCH: Force-kills strict lockfile enforcement
env:
  NPM_CONFIG_CI: false
  NPM_CONFIG_FUND: false
  NPM_CONFIG_AUDIT: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository Node
        uses: actions/checkout@v4

      - name: Initialize Node.js Environment Matrix
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Force-Sync All Project Dependencies
        run: |
          npm config set package-lock false
          npm install --legacy-peer-deps

      - name: Compile and Verify Production Web Distribution Bundle
        run: npm run build --if-present
