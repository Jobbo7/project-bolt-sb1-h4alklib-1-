name: Build Android Production Bundle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  compile-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Modern Java JDK 21 Compiler Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Force Clean Leftover Directory Fragments
        run: |
          rm -rf android || true
          rm -rf ./android || true
          rm -f capacitor.config.json || true

      - name: Patch Package Build Parameters
        run: |
          sed -i 's/"build": "tsc && vite build"/"build": "vite build"/g' package.json || true
          sed -i 's/"build": "tsc && build"/"build": "vite build"/g' package.json || true

      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: Bundle Production Web Code via Vite
        run: npm run build

      - name: Hard Sandbox Native Mobile Workspace
        run: |
          mkdir -p ../mobile-staging
          cp -r dist ../mobile-staging/
          cp package.json ../mobile-staging/
          
          cat << 'EOF' > ../mobile-staging/capacitor.config.json
          {
            "appId": "com.partsforge.trade",
            "appName": "PartsForge",
            "webDir": "dist"
          }
          EOF
          
          echo "STAGING_ROOT=$(cd ../mobile-staging && pwd)" >> $GITHUB_ENV

      - name: Build Pristine Native Mobile Layer Inside Sandbox
        run: |
          cd ${{ env.STAGING_ROOT }}
          npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev --legacy-peer-deps
          npx cap add android
          npx cap sync android

      - name: Inject Safe Initialisation Script Overrides
        run: |
          cd ${{ env.STAGING_ROOT }}/android
          
          cat << 'EOF' >> build.gradle
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      android {
                          compileSdkVersion 34
                          defaultConfig {
                              minSdkVersion 22
                              targetSdkVersion 34
                          }
                      }
                  }
              }
          }
          EOF

      - name: Compile Official Android App Bundle (.aab) via Isolated Cloud Gradle
        run: |
          cd ${{ env.STAGING_ROOT }}/android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --no-build-cache --parallel

      - name: Upload Final Build Artifact to Dashboard
        uses: actions/upload-artifact@v4
        with:
          name: partsforge-release.aab
          path: "**/android/app/build/outputs/bundle/release/app-release.aab"
          if-no-files-found: error
