name: PartsForge Automated Web Build Verification

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify-web-compilation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Source Code Files
        uses: actions/checkout@v4

      - name: Initialize Node.js Environment Matrix
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Project Dependencies and Core Packages
        run: npm ci

      - name: Compile and Verify Production Web Distribution Bundle
        run: npm run build --if-present
