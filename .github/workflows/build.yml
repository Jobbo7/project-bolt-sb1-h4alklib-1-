name: Build Android App Bundle Production Track

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-compile-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Source Code Files
        uses: actions/checkout@v4

      - name: Initialize Node.js Environment Matrix
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Project Dependencies and Core Packages
        run: npm ci

      - name: Setup Java JDK 21 Environment Compiler Gates
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK Environment Automation Runners
        uses: android-actions/setup-android@v3

      - name: Locate and Move to the True App Build Directory
        run: |
          if [ -f "settings.gradle" ]; then
            echo "DIR_PATH=." >> $GITHUB_ENV
          elif [ -d "app" ] && [ -f "app/settings.gradle" ]; then
            echo "DIR_PATH=app" >> $GITHUB_ENV
          elif [ -d "android" ]; then
            echo "DIR_PATH=android" >> $GITHUB_ENV
          else
            echo "DIR_PATH=$(find . -name "settings.gradle" -exec dirname {} \; | head -n 1)" >> $GITHUB_ENV
          fi

      - name: Reconstruct Production Android Signing Keystore File
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ${{ env.DIR_PATH }}/partsforge-permanent.keystore

      - name: Compile and Sign Production App Bundle via Adaptive Engine
        run: |
          cd ${{ env.DIR_PATH }}
          gradle bundleRelease \
            -Pandroid.injected.signing.store.file=partsforge-permanent.keystore \
            -Pandroid.injected.signing.store.password="partsforge123" \
            -Pandroid.injected.signing.key.alias="partsforge_key" \
            -Pandroid.injected.signing.key.password="partsforge123"

      - name: Upload Verified App Bundle to Play Console Deposit Track
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: "**/build/outputs/bundle/release/app-release.aab"
