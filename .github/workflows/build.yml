name: Build Android Production Bundle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  compile-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK Compiler Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Patch Package to Native Assets Build Target
        run: |
          sed -i 's/"build": "tsc && vite build"/"build": "vite build"/g' package.json || true
          sed -i 's/"build": "tsc && build"/"build": "vite build"/g' package.json || true

      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: Bundle Production Web Code via Vite
        run: npm run build

      - name: Build and Sync Native Mobile Layer
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev
          
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.partsforge.trade",
            "appName": "PartsForge",
            "webDir": "dist"
          }
          EOF
          
          # Smart Path Check: Skip adding the android folder if it is already in your repository branch
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android folder detected in source control. Skipping add block."
          fi
          
          npx cap sync android

      - name: Inject High Stability Android Compilation Variables
        run: |
          if [ -f "android/variables.gradle" ]; then
            sed -i 's/compileSdkVersion = .*/compileSdkVersion = 34/g' android/variables.gradle || true
            sed -i 's/targetSdkVersion = .*/targetSdkVersion = 34/g' android/variables.gradle || true
            sed -i 's/minSdkVersion = .*/minSdkVersion = 22/g' android/variables.gradle || true
          fi

      - name: Compile Official Android App Bundle (.aab) via Native Cloud Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload Final Build Artifact to Dashboard
        uses: actions/upload-artifact@v4
        with:
          name: partsforge-release.aab
          path: "**/android/app/build/outputs/bundle/release/app-release.aab"
          if-no-files-found: error
