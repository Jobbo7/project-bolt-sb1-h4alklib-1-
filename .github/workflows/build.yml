name: Generate and Extract Permanent Android Keystore

on:
  workflow_dispatch: # Allows you to trigger this manually with a single click

jobs:
  generate-permanent-key:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java JDK 21 Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Create Permanent Cryptographic Signature Keystore
        run: |
          # Natively generate the strict permanent signature file inside the cloud machine
          keytool -genkey -v -keystore partsforge-permanent.keystore -alias partsforge_key -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=PartsForge, OU=Production, O=PartsForge, L=Melbourne, S=Victoria, C=AU" \
            -storepass "partsforge123" -keypass "partsforge123"

      - name: Print True SHA1 Fingerprint and Extract Base64 String to Screen
        run: |
          echo "========================================================================"
          echo "🔒 STEP A: YOUR PERMANENT KEYSTORE SHA1 FINGERPRINT CHECK:"
          echo "========================================================================"
          keytool -list -v -keystore partsforge-permanent.keystore -storepass "partsforge123" | grep SHA1 || true
          
          echo "========================================================================"
          echo "🚀 STEP B: YOUR ANDROID_KEYSTORE_BASE64 STRING VALUE (COPY EVERYTHING BELOW):"
          echo "========================================================================"
          base64 -w 0 partsforge-permanent.keystore
          echo ""
          echo "========================================================================"

      - name: Upload Raw Keystore File as Temporary Artifact Drop
        uses: actions/upload-artifact@v4
        with:
          name: partsforge-permanent-keystore-file
          path: partsforge-permanent.keystore
